<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#173D6E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" href="assets/emblem.png" />
<meta name="description" content="The official app of the Romanian Orthodox Episcopate of America — liturgical calendar, the Bishop's Word, Solia, youth and prayers." />
<title>ROEA · Official App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Abril+Fatface&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>
  <!-- Splash: full name shown only here -->
  <div id="splash">
    <div class="splash-logo"><img src="assets/emblem.png" alt="ROEA" /></div>
    <h1 class="splash-title">Romanian Orthodox Episcopate<br/>of America</h1>
    <div class="splash-roea">ROEA</div>
    <p class="splash-sub">The Official App — Calendar · News · Today · Youth · Parishes</p>
  </div>

  <!-- Login gate (appears before everything) -->
  <div id="login" hidden>
    <div class="login-card">
      <img class="login-logo" src="assets/emblem.png" alt="ROEA" />
      <h1>ROEA</h1>
      <p class="login-sub">Sign in to the Episcopate community</p>
      <label class="field-label" for="l-email">Email</label>
      <input id="l-email" type="email" placeholder="you@roea.org" autocomplete="email" />
      <label class="field-label" for="l-pass">Password</label>
      <input id="l-pass" type="password" placeholder="• • • • • • • •" autocomplete="current-password" />
      <button class="btn primary block" id="l-go">Sign in</button>
      <button class="link-txt" id="l-forgot">Forgot password?</button>
      <p class="login-hint">Demo app — any email plus a password of at least 6 characters</p>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" hidden>
    <header id="topbar">
      <div class="topbar-brand">
        <span class="brand-mark"><img src="assets/emblem.png" alt="ROEA" /></span>
        <div class="topbar-title">
          <strong>ROEA</strong>
          <span id="topbar-caption">Official App</span>
        </div>
      </div>
      <div class="top-actions">
      <button class="icon-btn" id="btn-lang">EN</button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
      </div>
    </header>

    <main id="view"></main>

    <nav id="tabbar">
      <button class="tab" data-route="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="tab" data-route="news"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>News</span></button>
      <button class="tab tab-center" data-route="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg><span>Today</span></button>
      <button class="tab" data-route="youth"><svg viewBox="0 0 24 24"><path d="M12 3l2.1 5.6L20 11l-6 2.4L12 19l-2-5.6L4 11l6-2.4z"/></svg><span>Youth</span></button>
      <button class="tab" data-route="parishes"><svg viewBox="0 0 24 24"><path d="M12 3l8 5v13h-5v-7H9v7H4V8z"/></svg><span>Parishes</span></button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toasts"></div>
  </div>

  <script src="js/calendar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
